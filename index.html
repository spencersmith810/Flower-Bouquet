<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A living, shareable flower bouquet made with HTML canvas.">
  <title>Flower Bouquet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">A little garden, made for you</p>
      <h1>Flower <em>Bouquet</em></h1>
      <p class="lede">Choose a mood, write a message, and let the bouquet bloom.</p>
      <div class="message-row">
        <label for="message">Your message</label>
        <input id="message" maxlength="42" value="for you ♥" autocomplete="off">
      </div>
    </section>

    <section class="bouquet-card" aria-label="Animated flower bouquet">
      <canvas id="bouquet" aria-label="An animated flower bouquet"></canvas>
      <div class="card-glow"></div>
    </section>

    <section class="controls" aria-label="Bouquet controls">
      <div class="theme-list" id="themes"></div>
      <div class="control-row">
        <button id="pause" type="button">Pause</button>
        <label class="range-label" for="speed">Breeze <input id="speed" type="range" min="0" max="2" step="0.1" value="1"><span id="speed-value">1×</span></label>
        <button id="surprise" type="button" class="accent">Surprise me</button>
      </div>
      <p class="keyboard-hint">Tip: press <kbd>Space</kbd> to pause and <kbd>←</kbd> <kbd>→</kbd> to change bouquets.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
