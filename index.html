<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A living, shareable flower bouquet made with HTML canvas.">
  <title>Flower Bouquet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">A little garden, made for you</p>
      <h1>Flower <em>Bouquet</em></h1>
      <p class="lede">Choose a mood, write a message, and let the bouquet bloom.</p>
      <div class="message-row">
        <label for="message">Your message</label>
        <input id="message" maxlength="42" value="for you ♥" autocomplete="off">
      </div>
    </section>

    <section class="terminal-window" aria-label="Animated flower bouquet terminal">
      <div class="terminal-bar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="terminal-title">bouquet3d.py — terminal</span></div>
      <pre id="screen" aria-live="off"></pre>
    </section>

    <section class="controls" aria-label="Bouquet controls">
      <div class="theme-list" id="themes"></div>
      <div class="control-row">
        <button id="pause" type="button">Pause</button>
        <button id="slower" type="button">− Speed</button>
        <button id="faster" type="button">+ Speed</button>
        <button id="colors" type="button">Colors</button>
        <button id="hearts" type="button">More hearts</button>
        <button id="surprise" type="button" class="accent">Next bouquet</button>
      </div>
      <p class="keyboard-hint">Tip: press <kbd>Space</kbd> to pause and <kbd>←</kbd> <kbd>→</kbd> to change bouquets.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
